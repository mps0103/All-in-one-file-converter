org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true

# R8 full mode: more aggressive shrinking and optimisation of the release build.
# It is the default from Android Gradle plugin 8.0; set here so it stays on.
android.enableR8.fullMode=true

# Android Gradle plugin 9: keep the separate Kotlin plugin and the old DSL, as the
# React Native 0.87 template does. Both opt-outs go away with AGP 10.
android.builtInKotlin=false
android.newDsl=false
